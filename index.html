<style>

<script>
{

const localDay=t=>{const p=new Date(t).toLocaleDateString('en-CA',{timeZone:TZ});return p};

const ico=(n,s)=>'<i class="ti ti-'+n+'" aria-hidden="true" style="font-size:'+(s||16)+'px;vertical-align:-3px;margin-right:5px"></i>';

const bar=(p,c)=>'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,p))+'%;background:'+c+'"></i></div>';
const hm=s=>{s=String(s||'').trim().replace(/h$/i,':00').replace(/h/i,':');const m=s.match(/^(\d{1,3})(?::(\d{1,2}))?$/);if(!m)return null;const mm=m[2]?+m[2]:0;return mm>59?null:+m[1]*60+mm};
const brToIso=s=>{const m=String(s||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return null;const d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getDate()!=+m[1]||d.getMonth()!=+m[2]-1)return null;return m[3]+'-'+m[2]+'-'+m[1]};
let toastT;
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast hide',err?6000:3500)}
function errMsg(e){let m=(e&&(e.message||e.error_description||e.msg))||String(e);
 if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';

 if(/Password should be/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
 if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com o servidor. Tente de novo em instantes.';
 if(/row-level security|permission denied/i.test(m))return 'Você não tem permissão para isso.';
 return m}
async function run(p,okMsg){try{const r=await p;if(r&&r.error)throw r.error;if(okMsg)toast(okMsg);return r?r.data:null}catch(e){toast(errMsg(e),true);throw e}}
function csv(name,rows){const body='﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n');
 const b=new Blob([body],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('Planilha gerada: '+name)}
function sel(id,opts,val,newLabel){return '<select id="'+id+'" data-new="'+(newLabel?1:0)+'">'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+(newLabel?'<option value="'+NEW+'">➕ Criar novo…</option>':'')+'</select>'+(newLabel?'<input id="'+id+'_n" class="'+(opts.length?'hide':'')+'" placeholder="'+esc(newLabel)+'">':'')}
function val(id){const e=$(id);return e?e.value.trim():''}

async function fetchAll(table,build){let out=[],i=0;for(;;){let q=sb.from(table).select('*');if(build)q=build(q);const{data,error}=await q.range(i,i+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;i+=1000}return out}

/* ===== FERIADOS / DIAS ===== */
async function ensureFer(y){if(S.FER[y])return;const{data,error}=await sb.rpc('feriados',{ano:y});if(error){S.FER[y]={};return}const m={};(data||[]).forEach(f=>m[f.data]=f);S.FER[y]=m}
function afastOf(pid,d){return (S.D.afast||[]).find(a=>a.perfil_id===pid&&d>=a.data_ini&&d<=a.data_fim)}
function dayInfo(d,pid){const y=+d.slice(0,4),f=(S.FER[y]||{})[d],cal=(S.D.cal||[]).filter(c=>d>=c.data_ini&&d<=c.data_fim),dw=pd(d).getDay();
 const af=pid?afastOf(pid,d):null;if(af)return{k:'afast',n:af.tipo};
 const cf=cal.find(c=>c.comportamento==='feriado');if(f&&f.tipo!=='Ponto facultativo')return{k:'fer',n:f.nome,t:f.tipo};if(cf)return{k:'fer',n:cf.nome,t:cf.tipo};
 const cfa=cal.find(c=>c.comportamento==='facultativo');if(f)return{k:'fac',n:f.nome,t:f.tipo};if(cfa)return{k:'fac',n:cfa.nome,t:cfa.tipo};
 const cr=cal.find(c=>c.comportamento==='recesso');if(cr)return{k:'rec',n:cr.nome,t:cr.tipo};
 return{k:dw===0||dw===6?'fds':'util',n:dw===0?'Domingo':dw===6?'Sábado':'Dia útil'}}
function jorn(pid,d){const i=dayInfo(d,pid);if(['fer','rec','afast'].includes(i.k))return 0;const j=(S.D.jorn||[]).find(x=>x.perfil_id===pid&&x.dia_semana===pd(d).getDay());return j?j.minutos:0}
function pctDia(d){const i=dayInfo(d),dw=pd(d).getDay(),R=S.R;if(i.k==='fer')return R.pct_feriado;if(dw===0)return R.pct_domingo;if(dw===6)return R.pct_sabado;return R.pct_dia_util}

/* ===== CÁLCULO ===== */
function saldo(pid){
 const tol=S.R.tolerancia_dia_min||0,byDay={},inc=[];
 (S.D.turnos||[]).filter(t=>t.perfil_id===pid).forEach(t=>{if(t.incompleto){inc.push(t.dia);return}byDay[t.dia]=(byDay[t.dia]||0)+t.segundos/60});
 const ext={};let extra=0;Object.keys(byDay).forEach(d=>{const w=Math.round(byDay[d]),e=w-jorn(pid,d);if(e>tol){ext[d]=e;extra+=e}});
 const sol=(S.D.sol||[]).filter(s=>s.perfil_id===pid);
 let deb=0,aprov=0;sol.forEach(s=>{if(s.status!=='aprovada')return;if(s.tipo==='falta')deb+=s.minutos;else if(s.dia>=TODAY)aprov+=s.minutos});
 const h={feita:0,paga:0,compensada:0,debito:0};(S.D.hist||[]).filter(x=>x.perfil_id===pid).forEach(x=>{if(x.tipo==='abertura'){const d=x.detalhes||{};h.feita+=+d.feitas||0;h.paga+=+d.pagas||0;h.debito+=+d.debito||0}else h[x.tipo]+=x.minutos});
 deb+=h.debito;const bruto=extra+h.feita;let disp=Math.max(0,bruto-h.paga-h.compensada);const debR=Math.max(0,deb-h.compensada);const comp=Math.min(disp,debR);
 const pend=sol.filter(s=>s.status==='pendente').length+(S.D.cont||[]).filter(c=>c.perfil_id===pid&&c.status==='pendente').length;
 const inc30=inc.filter(d=>d>=ds(new Date(Date.now()-30*864e5))).length;
 const falta=debR-comp,receber=disp-comp;
 const st=pend>0||inc30>0?'pen':(falta>0?'pag':'ok');
 return{deb:debR,comp,falta,receber,aprov,extra,bruto,ext,pend,inc:inc30,st,pago:h.paga}}

 const since=ds(new Date(Date.now()-400*864e5));
 const q=(t,b)=>fetchAll(t,b).catch(()=>[]);
 const [regras,perfis,setores,deps,jorn,turnos,sol,cont,afast,hist,cal,fech,notif,avisos,lidos,msgs,anexos]=await Promise.all([
  sb.from('regras').select('*').eq('id',1).maybeSingle().then(r=>r.data||{}),
  q('perfis',x=>x.order('nome')),q('setores',x=>x.order('nome')),q('departamentos',x=>x.order('nome')),q('jornadas'),
  q('v_turnos',x=>x.gte('dia',since)),q('solicitacoes',x=>x.order('criado_em',{ascending:false})),q('contestacoes',x=>x.order('criado_em',{ascending:false})),
  q('afastamentos'),q('lancamentos_historico'),q('calendario_empresa'),q('fechamentos'),
  q('notificacoes',x=>x.order('criado_em',{ascending:false}).limit(200)),q('avisos',x=>x.order('criado_em',{ascending:false}).limit(200)),q('avisos_leituras'),
  q('mensagens',x=>x.order('criado_em',{ascending:false}).limit(300)),q('anexos')]);
 S.R=regras;Object.assign(S.D,{perfis,setores,deps,jorn,turnos,sol,cont,afast,hist,cal,fech,notif,avisos,lidos,msgs,anexos});
 const ys=new Set([today.getFullYear()-1,today.getFullYear(),today.getFullYear()+1,S.calY]);await Promise.all([...ys].map(ensureFer));
 S.me=perfis.find(p=>p.user_id===S.user.id)||S.me;

}

function ring(a,comp,ap){const C=2*Math.PI*44,pf=a?comp/a:0,pp=a?Math.min(a-comp,ap)/a:0,p=Math.round(pf*100);
 const arc=(l,o,c,op)=>'<circle cx="56" cy="56" r="44" fill="none" stroke-width="12" transform="rotate(-90 56 56)" stroke-dasharray="'+C*l+' '+C+'" stroke-dashoffset="'+(-C*o)+'" stroke="'+c+'" opacity="'+op+'"/>';
 return '<svg width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="'+p+'% compensado"><circle cx="56" cy="56" r="44" fill="none" stroke-width="12" stroke="#eceef2"/>'+arc(pf,0,'#16a34a',1)+arc(pp,pf,'#2563eb',.5)+'<text x="56" y="59" text-anchor="middle" font-size="24" font-weight="800" fill="#16181d" font-family="Manrope">'+p+'%</text><text x="56" y="76" text-anchor="middle" font-size="11" font-weight="700" fill="#5d6370" font-family="Manrope">compensado</text></svg>'}
function crono(){const m=S.D.todayMarks||[];const td=m.filter(x=>localDay(x.registrado_em)===TODAY);if(!td.length)return null;
 let w=0;for(let i=0;i+1<td.length;i+=2)w+=(new Date(td[i+1].registrado_em)-new Date(td[i].registrado_em))/1000;const open=td.length%2===1;if(open)w+=(Date.now()-new Date(td[td.length-1].registrado_em))/1000;
 return{w,open,td}}

 h+='<div class="card" style="background:var(--probg);border-color:#ddd0fb;color:var(--pro)"><b>'+ico('cash',20)+'Horas extras a receber</b><p class="big">'+fm(k.receber)+'</p><p class="sm" style="color:var(--pro)">Previsto com as horas aprovadas: '+fm(Math.max(0,k.receber+k.aprov-k.falta))+'. Regra da empresa: '+(S.R.excedente==='banco'?'vai para o banco de horas':'pago em folha')+'.</p></div>';

 if(t.id==='fy'){S.fy=+t.value;if(S.psub!=='folha')render()}if(t.id==='fm'){S.fm=+t.value;if(S.psub!=='folha')render()}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='pq'){S.pq=t.value;drawPonto()}if(t.id==='rq'){S.rq=t.value;drawRH()}
 if(t.id==='cy_n'&&/^\d{4}$/.test(t.value)){S.calY=+t.value;S.sel=null;render()}});

/* ===== BOOT ===== */
async function boot(){const{data}=await sb.auth.getSession();S.user=data.session?data.session.user:null;if(!S.user){render();return}
 $('app').innerHTML='<div class="ld">Carregando seus dados…</div>';
 try{await loadAll();if(S.me)await loadToday()}catch(e){toast(errMsg(e),true)}render()}
if(!window.supabase){$('app').innerHTML='<div class="login"><div class="card"><p class="t">Não foi possível carregar o app</p><p class="sm">Verifique sua internet e recarregue a página.</p></div></div>'}
else if(key){sb=window.supabase.createClient(SUPABASE_URL,key,{auth:{persistSession:true,autoRefreshToken:true}});
 sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&(!S.user||S.user.id!==(s&&s.user.id))){S.user=s.user;boot()}if(e==='SIGNED_OUT'){S.user=null;S.me=null;render()}if(e==='PASSWORD_RECOVERY'){S.user=s.user;S.tab[S.view]='conta';boot().then(()=>toast('Defina sua nova senha abaixo.'))}});
 boot()}
else render();
}
</script>
