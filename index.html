 const sol=(S.D.sol||[]).filter(s=>s.perfil_id===pid);
 let deb=0,aprov=0;sol.forEach(s=>{if(s.status!=='aprovada')return;if(s.tipo==='falta')deb+=s.minutos;else if(s.dia>=TODAY)aprov+=s.minutos});

 async rhaviso(){const d=val('rd'),t=val('at'),x=val('ax'),fs=[...($('af2').files||[])];if(!t||!x)return toast('Preencha título e texto.',true);const[e,id]=d.split(':');
  const row={autor_id:S.me.id,escopo:e,titulo:t,texto:x};if(e==='departamento')row.departamento_id=+id;if(e==='setor')row.setor_id=+id;if(e==='pessoa')row.alvo_id=id;
  const r=await run(sb.from('avisos').insert(row).select('id').single());if(fs.length)await upload(fs,'aviso_id',r.id);toast('Aviso publicado.');await refresh()},
 async saverg(){const n=k=>{const v=parseFloat(String(val('rg_'+k)).replace(',','.'));if(isNaN(v)||v<0)throw new Error('Confira os números das regras.');return v};
  try{const t=x=>{const v=val('rg_'+x);if(!/^\d{1,2}:\d{2}$/.test(v))throw new Error('Horário noturno no formato hh:mm.');return v};
   const row={tolerancia_dia_min:n('t'),limite_extra_dia_min:n('d'),limite_mes_min:n('m'),descanso_min_min:n('s'),bloquear_acima:val('rg_b')==='true',excedente:val('rg_x'),prazo_compensacao_dias:n('p'),pct_dia_util:n('u'),pct_sabado:n('sa'),pct_domingo:n('do'),pct_feriado:n('fe'),noturno_ativo:val('rg_n')==='true',noturno_inicio:t('ni'),noturno_fim:t('nf'),adicional_noturno_pct:n('na'),pagamento_dia_util:Math.max(1,Math.round(n('pg'))),remetente_ponto:(val('rg_rem')||'rhid.naoresponda@controlid.com.br').toLowerCase()};
   await run(sb.from('regras').update(row).eq('id',1),'Regras salvas.');await refresh()}catch(e){toast(errMsg(e),true)}},
 async demo(){await run(sb.rpc('carregar_demo'),'Dados de exemplo carregados.');await refresh()},
 demoask(){S.del=true;render()},
 async demodel(){if(val('dc')!=='APAGAR')return toast('Digite APAGAR para confirmar.',true);await run(sb.rpc('limpar_dados_demo'),'Dados de demonstração apagados. Siga o assistente.');S.del=false;await refresh()},
 ex(b){const e=S.EXP[b.dataset.v];if(!e)return toast('Nada para exportar ainda.',true);csv(e.file,e.rows)},
 gsort(b){const id=b.dataset.v,i=+b.dataset.i,st=S.G[id];if(!st)return;if(st.s===i)st.d*=-1;else{st.s=i;st.d=1}drawGrid(id)},
 gex(b){gExport(b.dataset.v)},
 gexa(b){gExport(b.dataset.v,1)},
 async sendrh(){const tp=selText('srt'),pid=val('srp'),dd=val('srd'),x=val('srx'),fs=[...($('srf').files||[])];if(!tp)return toast('Escolha ou digite o tipo.',true);if(!x)return toast('Escreva a descrição.',true);if(dd&&!br2Iso(dd))return toast('Data no formato dd/mm/aa.',true);
  const row={de_id:S.me.id,para_rh:true,para_id:null,tipo_nome:'Solicitação: '+tp,assunto:tp+(pid==='*'?' · equipe toda':pid?' · '+nome(pid):''),corpo:x+(dd?'\nData: '+dd:'')};const r=await run(sb.from('mensagens').insert(row).select('id').single());if(fs.length&&r)await upload(fs,'mensagem_id',r.id);toast('Solicitação enviada ao RH.');await refresh()},
 chm(b){S.ch.m=b.dataset.v;if(S.ch.m==='per'&&!S.ch.a){S.ch.a=ds(new Date(Date.now()-14*864e5));S.ch.b=TODAY}render()},
 gdet(b){S.gdet=b.dataset.v||null;render();window.scrollTo(0,0)},
 pdet(b){S.pdet=b.dataset.v||null;render();window.scrollTo(0,0)},
 pfunc(){S.rf='todos';S.rq='';S.pdet=null;S.tab.r='func';render();window.scrollTo(0,0)},
 rpend(){S.pdet=null;S.tab.r='ponto';S.psub='cont';render();window.scrollTo(0,0)},
 cobi(b){const[k,id]=b.dataset.v.split(':');let h='';if(k==='a'){const a=(S.D.afast||[]).find(x=>String(x.id)===id);if(!a)return;h='<b>Afastamento · '+esc(nome(a.perfil_id))+'</b><br>'+esc(a.tipo)+' · '+br(a.data_ini)+' a '+br(a.data_fim)}
  else{const s=(S.D.sol||[]).find(x=>String(x.id)===id);if(!s)return;h='<b>'+esc(tipoSol(s))+' · '+esc(nome(s.perfil_id))+'</b><br>'+WD[pd(s.dia).getDay()]+', '+br(s.dia)+' · '+fm(s.minutos)+' · '+stTxt(s.status)+(s.motivo?'<br>Motivo: '+esc(s.motivo):'')}
  const e=$('cobi');if(e)e.innerHTML='<div class="msg" style="margin-top:8px">'+ico('info-circle')+h+'</div>'},
};

document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const f=A[b.dataset.act];if(!f)return;ev.preventDefault();if(b.disabled)return;b.disabled=true;try{await f(b)}catch(e){}finally{if(document.body.contains(b))b.disabled=false}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.tagName==='SELECT'&&t.dataset.new==='1'){const n=$(t.id+'_n');if(n){n.classList.toggle('hide',t.value!==NEW);if(t.value===NEW)n.focus()}}
 if(t.id==='st'){$('stb').classList.toggle('hide',t.value!==NEW)}
 if(t.id==='cc'){$('ccb').classList.toggle('hide',t.value!==NEW)}
 if(t.id==='ps'){const d=$('psd');if(d)d.classList.toggle('hide',t.value!==NEW)}
 if(t.id==='cy'){if(t.value!==NEW){S.calY=+t.value;S.sel=null;render()}}
 if(t.id==='cm'){S.calM=+t.value;S.sel=null;render()}
 if(t.id==='py'){S.pY=+t.value;render()}if(t.id==='pmo'){S.pM=+t.value;render()}
 if(t.id==='fy'||t.id==='fm'){S[t.id]=+t.value;S.pa=S.pb=null;S.resumo=null;render()}
 if(t.id==='chmes'&&t.value){S.ch.ym=t.value;render()}
 if(t.id==='md'){S.md=t.value;$('mdp').innerHTML=mdSetor(t.value)}
 if(t.id==='mds'){S.mds=+t.value;$('mdpp').innerHTML=mdPessoas(t.value)}
 if(t.dataset.gf){S.G[t.dataset.gf].f=t.value;drawGrid(t.dataset.gf)}
 if(t.id==='ap'){const e=$('aps');if(e)e.textContent=setorDe(t.value)}
 if(t.id==='hp'){const e=$('hps'),n=$('hpn');if(e)e.textContent=t.value===NEW?'Pessoa nova: preencha os dados abaixo':setorDe(t.value);if(n)n.classList.toggle('hide',t.value!==NEW)}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='pq'){S.pq=t.value;drawPonto()}if(t.id==='rq'){S.rq=t.value;drawRH()}
 if(t.dataset.grid){S.G[t.dataset.grid].q=t.value;drawGrid(t.dataset.grid)}
 if(t.dataset.fl)applyFl(t);
 if(t.id==='apq'){const q=norm(t.value.trim()),s=$('ap');if(s){const pp=(S.D.perfis||[]).filter(p=>p.ativo&&(!q||norm(pLab(p)).includes(q)));s.innerHTML=pp.map(p=>'<option value="'+esc(p.id)+'">'+esc(pLab(p))+'</option>').join('')||'<option value="">Ninguém encontrado</option>';const e=$('aps');if(e)e.textContent=pp[0]?setorDe(pp[0].id):''}}
 if(t.dataset.dt){const dg=t.value.replace(/\D/g,'').slice(0,6);const v=dg.slice(0,2)+(dg.length>2?'/'+dg.slice(2,4):'')+(dg.length>4?'/'+dg.slice(4):'');if(v!==t.value)t.value=v;if(dg.length===6){const iso=br2Iso(v);if(iso)dtSet(t.id,iso);else toast('Data inválida.',true)}}
 if(t.id==='ch'||t.id==='rg_ni'||t.id==='rg_nf'){const dg=t.value.replace(/\D/g,'').slice(0,4),v=dg.length>2?dg.slice(0,2)+':'+dg.slice(2):dg;if(v!==t.value)t.value=v}
 if(t.id==='cy_n'&&/^\d{4}$/.test(t.value)){S.calY=+t.value;S.sel=null;render()}});

/* ===== BOOT ===== */
async function boot(){const{data}=await sb.auth.getSession();S.user=data.session?data.session.user:null;if(!S.user){render();return}
 $('app').innerHTML='<div class="ld">Carregando seus dados…</div>';
 try{await loadAll();if(S.me)await loadToday()}catch(e){toast(errMsg(e),true)}render()}
if(!window.supabase){$('app').innerHTML='<div class="login"><div class="card"><p class="t">Não foi possível carregar o app</p><p class="sm">Verifique sua internet e recarregue a página.</p></div></div>'}
else if(key){sb=window.supabase.createClient(SUPABASE_URL,key,{auth:{persistSession:true,autoRefreshToken:true}});
 sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&(!S.user||S.user.id!==(s&&s.user.id))){S.user=s.user;boot()}if(e==='SIGNED_OUT'){S.user=null;S.me=null;render()}if(e==='PASSWORD_RECOVERY'){S.user=s.user;S.tab[S.view]='conta';boot().then(()=>toast('Defina sua nova senha abaixo.'))}});
 boot()}
else render();
}
